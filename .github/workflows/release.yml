name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon app_icon.ico --name "StarlinkScanner-Windows" --collect-all customtkinter main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlinkScanner-Windows
          path: dist/StarlinkScanner-Windows.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: ./android_project
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/*.apk ../dist-android/StarlinkScanner-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlinkScanner-Android
          path: dist-android/StarlinkScanner-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: StarlinkScanner-Windows
          path: ./release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: StarlinkScanner-Android
          path: ./release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: Starlink Scanner ${{ steps.versioning.outputs.TAG }}
          body: |
            ## 🛰 Starlink Scanner Release ${{ steps.versioning.outputs.TAG }}

            ### 📦 دانلود فایل‌های نصبی (Assets)
            * **نسخه ویندوز (Windows):** `StarlinkScanner-Windows.exe` (بدون نیاز به نصب، اجرای مستقیم با دابل‌کلیک)
            * **نسخه اندروید (Android):** `StarlinkScanner-Android.apk` (دارای رفع کامل باگ ذخیره GPS و رادار زنده)

            ---

            ### ✨ تغییرات و ویژگی‌های این نسخه (Release Notes)
            1. **کلاینت داخلی اشکال‌زدایی بی‌سیم (Wireless Debugging ADB Client):** قابلیت اتصال مستقیم و درون‌برنامه‌ای به سوکت ADB گوشی (localhost / 127.0.0.1) بدون نیاز به کامپیوتر یا ابزار جانبی.
            2. **اجرای خودکار دستورات بهینه‌سازی شل (Auto-Optimize):** اجرای خودکار دستورات حذف Throttling اسکن، استارت اسکن سخت‌افزاری و اعطای دسترسی‌های تشخیصی DUMP به محض اتصال به Wireless Debugging.
            3. **ترمینال و کنسول زنده دستورات ADB:** امکان مشاهده لاگ‌های اجرای دستورات و ارسال دستورات دستی شل اندروید با نمایش لحظه‌ای خروجی.
            4. **ماژول پایش اسکن توربو و راهنمای ۳ روشی:** بررسی لحظه‌ای وضعیت محدودیت زمانی اسکن و سطح دسترسی UID 2000.
            5. **کارت‌های تفکیک امتیاز (Breakdown) و طراحی Material Design 3:** کارت‌های آکاردئونی بازشونده با تیک پارامترهای شناسایی استارلینک.
            6. **آیکون اختصاصی و اسکن کاملاً سایلنت در ویندوز:** بدون باز شدن ترمینال CMD در پس‌زمینه.
          files: |
            ./release-assets/StarlinkScanner-Windows.exe
            ./release-assets/StarlinkScanner-Android.apk
          draft: false
          prerelease: false
