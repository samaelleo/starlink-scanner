name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon app_icon.ico --name "StarlinkScanner-Windows" --collect-all customtkinter main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlinkScanner-Windows
          path: dist/StarlinkScanner-Windows.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: ./android_project
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/*.apk ../dist-android/StarlinkScanner-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlinkScanner-Android
          path: dist-android/StarlinkScanner-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: StarlinkScanner-Windows
          path: ./release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: StarlinkScanner-Android
          path: ./release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: Starlink Scanner ${{ steps.versioning.outputs.TAG }}
          body: |
            ## 🛰 Starlink Scanner Release ${{ steps.versioning.outputs.TAG }}

            ### 📦 دانلود فایل‌های نصبی (Assets)
            * **نسخه ویندوز (Windows):** `StarlinkScanner-Windows.exe` (بدون نیاز به نصب، اجرای مستقیم با دابل‌کلیک)
            * **نسخه اندروید (Android):** `StarlinkScanner-Android.apk` (دارای رفع کامل باگ ذخیره GPS و رادار زنده)

            ---

            ### ✨ تغییرات و ویژگی‌های این نسخه (Release Notes)
            1. **طراحی آیکون اختصاصی و مدرن:** تجهیز اپلیکیشن در هر دو نسخه ویندوز و اندروید به آیکون مدرن بشقاب/رادار استارلینک در تمام ابعاد و رزولوشن‌ها.
            2. **کارت‌های آکاردئونی و تفکیک امتیاز (Breakdown) در اندروید:** باز شدن کارت‌ها با Tap و نمایش تفصیلی کلیه پارامترهای شناسایی و تطبیق استارلینک با تیک سبز (✔) یا علامت خاکستری (✖).
            3. **رابط کاربری مدرن بر پایه Material Design 3:** استفاده از مؤلفه‌های رسمی M3 شامل ElevatedCard، FilterChip، و LinearProgressIndicator در اندروید.
            4. **کنترل بی‌صدای اسکن ویندوز در پس‌زمینه:** اجرای کاملاً سایلنت فرآیندهای netsh و powershell بدون باز و بسته شدن مکرر پنجره‌های ترمینال CMD.
            5. **امضای رسمی و دائمی APK با Release Keystore:** رفع خطای «برنامه ناامن» (Play Protect) و امکان آپدیت روان و بدون خطای امضا روی نسخه‌های قبلی.
            6. **تب اختصاصی تنظیمات در اندروید:** مدیریت حساسیت اسکنر، حذف تاریخچه دیتابیس، و استخراج گزارش.
          files: |
            ./release-assets/StarlinkScanner-Windows.exe
            ./release-assets/StarlinkScanner-Android.apk
          draft: false
          prerelease: false
